[package]
name = "tropel-variables"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = true
description = "Internal to tropel-runtime. No stability guarantee — depend on tropel-runtime instead."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
rand.workspace = true
# `serde` on chrono only adds its derive glue; nothing serializes chrono
# types here. Same inheritance caveat: direct dep.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# Clock back end on wasm32-unknown-unknown: std's SystemTime::now() panics
# there (no clock in non-WASI JS hosts), which would take down every
# $timestamp-shaped dynamic variable. web-time is a drop-in replacement
# backed by the host's Date.now() (browser + Node); native/WASI builds are
# untouched by this target-gated dependency.
[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dependencies]
web-time = "1"

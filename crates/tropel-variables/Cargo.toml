[package]
name = "tropel-variables"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = true
description = "Internal to tropel-runtime. No stability guarantee — depend on tropel-runtime instead."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
rand.workspace = true
# Narrowed regex (direct dep, NOT workspace inheritance — cargo silently
# ignores a member's `default-features = false` when the workspace entry
# leaves defaults on, which it does here): the catalog patterns are
# ASCII-only (`\{\{\$guid\}\}`, `\d` length args, `[^}]`), so the default
# Unicode property tables (~400 KB of wasm data, twiggy-measured) are dead
# weight on the browser tier. Direct deps still unify inside any single
# build graph — native consumers that pull regex with defaults keep their
# unicode tables; only this crate's own graph narrows.
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
# `serde` on chrono only adds its derive glue; nothing serializes chrono
# types here. Same inheritance caveat: direct dep.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# Clock back end on wasm32-unknown-unknown: std's SystemTime::now() panics
# there (no clock in non-WASI JS hosts), which would take down every
# $timestamp-shaped dynamic variable. web-time is a drop-in replacement
# backed by the host's Date.now() (browser + Node); native/WASI builds are
# untouched by this target-gated dependency.
[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dependencies]
web-time = "1"

[package]
name = "tropel-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = true
description = "Internal to tropel-runtime. No stability guarantee — depend on tropel-runtime instead."

[dependencies]
tropel-sdk.workspace = true
tropel-js.workspace = true
sha2.workspace = true
sha1.workspace = true
sha3.workspace = true
md-5.workspace = true
md4.workspace = true
ripemd.workspace = true
hmac.workspace = true
hmac012.workspace = true
aes.workspace = true
aes-gcm.workspace = true
cbc.workspace = true
base64.workspace = true
hex.workspace = true
percent-encoding.workspace = true
uuid.workspace = true
rand.workspace = true
regex.workspace = true
serde_json.workspace = true
simd-json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# P5b (TROPEL_WASM_BUILD.md Step 3): the workspace rquickjs is
# `full-async` (dyn-load/parallel — dlopen + threads, impossible on wasm).
# tropel-native only uses rquickjs::function (ungated), so the same
# narrowed wasm32 set as tropel-js applies.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rquickjs.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
rquickjs = { version = "0.12.2", default-features = false, features = ["std", "classes", "properties", "array-buffer", "futures", "loader", "macro"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

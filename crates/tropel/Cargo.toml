[package]
name = "tropel"
version = "0.6.0"
edition.workspace = true
license.workspace = true
description = "The tropel CLI — run Postman collections, HAR files, OpenAPI specs, Bruno and Insomnia exports, and k6 scripts as load tests."
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tropel"
path = "src/main.rs"

[features]
default = ["alloc-mimalloc"]
# Use mimalloc as the global allocator (default, well-tested)
alloc-mimalloc = ["dep:mimalloc"]
# Use tikv-jemallocator as the global allocator (better for large RSS)
alloc-jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
tropel-sdk.workspace = true
tropel-engine.workspace = true
tropel-metrics.workspace = true
# P6: `tropel agent` — the API client's process boundary. Lives here (not in
# the engine CLI) because tropel-distributed depends on tropel-engine; a
# CLI-level reference would be a dependency cycle.
tropel-distributed.workspace = true
# Reference extension: links its inventory-registered outputs (e.g.
# "prometheus") into the binary so ExtensionRegistry can find them.
tropel-x-prometheus.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
mimalloc = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
csv = "1.4.0"

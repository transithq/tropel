[package]
name = "tropel-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Criterion benchmark suite for Tropel: context bootstrap, per-iteration overhead, native-vs-JS, pool dispatch, memory-per-VU"

[dependencies]
tropel-js.workspace = true
tropel-native.workspace = true
tropel-engine.workspace = true
tropel-metrics.workspace = true
tropel-sdk.workspace = true
tropel-http.workspace = true
tokio.workspace = true

[dev-dependencies]
# Minimal criterion (no plotters/html_reports/rayon — keeps the dep tree lean).
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
# RSS measurement for the memory-per-VU bench (Windows). Already in the tree.
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
# RSS measurement on macOS: mach task_info (MACH_TASK_BASIC_INFO).
libc = "0.2"
# TR-002/TR-304: the OTLP window bench measures the REAL encoder. It calls
# `tropel_report::otlp::{encode_export_body, gzip_body}` — the exact functions
# the flush path calls — for BOTH the JSON and protobuf arms, so neither arm is
# a re-implementation and the two are directly comparable. The bench this
# replaced gzipped a synthetic string and its CPU number described nothing in
# the product.
#
# `serde_json` and `flate2` were direct dev-deps here only because the bench
# used to serialise and compress by hand. Routing through the production
# functions orphaned both, so they are dropped rather than left dangling.
tropel-report.workspace = true

# `libc::mach_task_self` is deprecated in favour of `mach2`, and a deprecation
# is an error under `-D warnings` — so this crate did not lint on macOS. CI runs
# clippy on ubuntu only, and `cargo test` skips `harness = false` benches, so
# nothing caught it: the bench crate went uncompiled on the very platform its
# MEAS numbers were taken on (TR-002). `mach2` is already in the tree via
# wasmtime, so this adds no dependency weight.
[target.'cfg(target_os = "macos")'.dev-dependencies]
mach2 = "0.5"

[[bin]]
name = "soak"
path = "src/bin/soak.rs"

[[bin]]
name = "perf-regression"
path = "src/bin/perf-regression.rs"

[[bench]]
name = "perf"
harness = false

# RSS sampling for the soak harness. Scoped per-target so adding it does not
# perturb the dependency graph on the other two platforms — declaring
# windows-sys unconditionally re-unified it from 0.52 to 0.61 for unrelated
# crates, which is a bigger change than a soak harness should make.
#
# `libc::mach_task_self` is deprecated in favour of `mach2`, and a deprecation
# is an error under `-D warnings`. mach2 is already in the tree via wasmtime.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[package]
name = "tropel-engine"
version = "0.6.0"
edition.workspace = true
license.workspace = true
description = "The tropel load-test engine: scenario execution, VU scheduling, the protocol registry and the metrics pipeline."
repository.workspace = true
rust-version.workspace = true

# The shared JS shim tree is reached through the in-crate `js` symlink (-> the
# repo-root js/), because include_str! cannot read outside the package root and
# cargo would otherwise package nothing for it. Cargo DEREFERENCES the symlink
# into the tarball, so the sources ship as real files; it also walks the linked
# directory directly rather than via git, so untracked macOS junk in there would
# ship too. Excluded so the tarball does not depend on who opened Finder.
exclude = ["js/**/.DS_Store"]

[dependencies]
tropel-sdk.workspace = true
tropel-core.workspace = true
# P5b: the workspace now declares tropel-runtime default-features = false
# (browser slice must not drag reqwest/tokio-net into the wasm graph). The
# native engine needs pm.sendRequest, so opt back in explicitly.
tropel-runtime = { workspace = true, features = ["send-request"] }
tropel-scheduler.workspace = true
tropel-report.workspace = true
tropel-metrics.workspace = true
tropel-ext.workspace = true
tropel-http.workspace = true
tropel-variables.workspace = true
# TR-445: the agent exposes the AUTH BUILDERS so the desktop tier does not
# have to re-implement signing in TypeScript (knockport invariant #3).
tropel-auth = { workspace = true, default-features = false }
base64.workspace = true
tropel-collection.workspace = true
tropel-js.workspace = true
# P5b: sandbox's send-request is no longer a default feature (workspace
# declares default-features = false so the wasm graph stays reqwest-free).
# The engine is native-only and uses pm.sendRequest, so opt back in.
tropel-sandbox = { workspace = true, features = ["send-request"] }
tropel-native.workspace = true
tropel-es.workspace = true
tropel-build.workspace = true
tropel-input-postman.workspace = true
tropel-input-k6.workspace = true
tropel-input-har.workspace = true
tropel-input-openapi.workspace = true
tropel-input-subprocess.workspace = true
tropel-input-http.workspace = true
tropel-input-bru.workspace = true
tropel-input-insomnia.workspace = true
tropel-input-knockport.workspace = true
tropel-wasm.workspace = true
tropel-x-grpc.workspace = true
tropel-x-websocket.workspace = true
rquickjs.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rand.workspace = true
clap.workspace = true
csv.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

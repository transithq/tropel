[package]
name = "tropel-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "WASM plugin runtime for Tropel — loads and runs WebAssembly plugins via wasmtime"

[dependencies]
tropel-sdk.workspace = true
tropel-http.workspace = true
async-trait.workspace = true
inventory.workspace = true
tokio.workspace = true
# wasmtime 47 (latest). We build only what the plugin runtime needs:
# cranelift (JIT + precompile_module), wat (WAT text in tests),
# pooling-allocator (PoolingAllocationConfig), runtime + std (core
# engine/module/instance APIs). The heavy optional machinery
# (component-model, gc, profiling, coredump, async, cache) stays off —
# smaller binaries and faster builds.
#
# Note: wasmtime <47 aborted the whole process on Windows when a trap
# fired (fuel/epoch) — the old longjmp-based trap unwinding tripped MSVC's
# /GS stack-cookie check (STATUS_STACK_BUFFER_OVERRUN). wasmtime 47
# rewrote trap unwinding with a dedicated unwinder crate, which traps
# cleanly on Windows (verified by the infinite-loop test).
#
# The .4 PATCH FLOOR IS A SECURITY FLOOR — do not relax it to "47" or
# "47.0". Two advisories land on 47.0.0–47.0.3, both fixed in 47.0.4:
#
#   RUSTSEC-2026-0269 (CVSS 8.8 HIGH) — filesystem sandbox escape when
#     paths or symlinks contain trailing slashes. This crate IS the
#     sandbox for third-party plugin input adapters, so an escape here
#     defeats the boundary the WASM tier exists to provide.
#   RUSTSEC-2026-0268 (CVSS 6.9) — guest-controlled host heap allocation
#     via WASIp3 streams.
wasmtime = { version = "47.0.4", default-features = false, features = [
    "anyhow",
    "cranelift",
    "wat",
    "pooling-allocator",
    "runtime",
    "std",
] }
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sha2.workspace = true
# Keyed sidecar (P0): hmac authenticates the AOT `.cwasm` artifact under a
# per-user key; rand generates that key. The bare sha256 self-hash was
# integrity-only — a local attacker writes both halves.
hmac.workspace = true
rand.workspace = true

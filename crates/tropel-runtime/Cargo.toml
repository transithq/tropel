[package]
name = "tropel-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = true
description = "Internal to tropel-runtime. No stability guarantee — depend on tropel-runtime instead."

[features]
# P5b (TROPEL_WASM_BUILD.md Step 4): tropel-sandbox's default `send-request`
# feature drags tropel-http → reqwest → tokio-net into the wasm graph, which
# cannot compile on wasm32. Forward the feature so the native default keeps
# pm.sendRequest while the browser slice builds with --no-default-features.
default = ["send-request"]
send-request = ["tropel-sandbox/send-request"]

[dependencies]
tropel-sdk.workspace = true
tropel-sandbox = { workspace = true, default-features = false }
tropel-js.workspace = true
tropel-variables.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true

[dev-dependencies]
# Test-only concrete DriverHttpClient wrapper (TestHttpClient) in runner.rs.
tropel-http.workspace = true
# tokio is TEST-ONLY in this crate (`#[tokio::test]` + `tokio::time::timeout`
# in runner.rs). Declaring it as a dev-dep keeps the library build free of
# tokio's wasm-incompatible features (`net`/`signal`/`rt-multi-thread` don't
# exist on wasm32) — the P5b browser slice can check this crate for wasm
# without dragging the full tokio feature set into the wasm graph.
tokio.workspace = true

[package]
name = "tropel-report"
version = "0.6.0"
edition.workspace = true
license.workspace = true
description = "Report rendering for tropel runs — the summary tables, thresholds verdicts and JSON/JUnit artifacts."
repository.workspace = true
rust-version.workspace = true

[dependencies]
tropel-sdk.workspace = true
tropel-core.workspace = true
tropel-metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio.workspace = true
chrono.workspace = true
reqwest.workspace = true
snap.workspace = true
# TR-304: gzip compression for OTLP request bodies (flate2 is a workspace
# dep, ~54 KB, used by tropel-input-k6 and tropel-http; no new transitive
# deps).
flate2.workspace = true

[dev-dependencies]
insta.workspace = true
# TR-304: DEV-ONLY. The OTLP protobuf encoder in `src/otlp_proto.rs` is
# hand-rolled and links no protobuf runtime; `prost` is used solely to decode
# what it produces in `round_trip_decodes_under_prost`, so the wire bytes are
# checked against a third-party implementation rather than our own reader.
# Already in Cargo.lock via tropel-x-grpc — adds no new package to the tree.
prost.workspace = true

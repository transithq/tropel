# Tropel CI
#
# Commit to: .github/workflows/ci.yml
#
# Public repo => GitHub Actions standard runners are free with unlimited minutes.
#
# Design notes:
#  - `clippy` uses --all-targets, which the justfile's `lint` recipe omits. That
#    means tests, benches and examples are linted too (where warnings hid before).
#  - `test` runs on all three OSes because the codebase has platform-specific
#    code (mach task_info on macOS, /proc on Linux, GetProcessMemoryInfo +
#    a past LNK1140 link failure on Windows). fail-fast is off so one flaky
#    platform doesn't mask the others.
#  - `msrv` enforces the declared rust-version = "1.85"; nothing did before.
#  - `smoke` is the important one: it runs the built BINARY end-to-end against
#    the repo's example samples (k6, postman, openapi, har) and asserts metrics
#    were actually produced. Unit tests can pass while the binary silently does
#    zero iterations and exits 0 (that exact class of bug has shipped twice).
#    This gate is what catches it.
#  - timeout-minutes is set on every job: the engine has known hang paths, and
#    an unbounded run would otherwise burn a full 6h runner slot.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    # P4a (TROPEL_MODULARIZATION_TODO.md): docs-only PRs skip the full matrix.
    # Everything that can affect a build is covered: crates, the shim bundle,
    # workspace manifests, CI itself, and the vendored toolchain config.
    #
    # Branch-protection note: these trigger-level filters skip EVERY job
    # (including ci-ok) for out-of-scope PRs, so if ci-ok is a required status,
    # docs-only PRs will sit as "expected — waiting for status". Either keep
    # ci-ok required only for code PRs, or switch this to paths-ignore if the
    # block bites.
    paths:
      - 'crates/**'
      - 'js/**'
      - 'examples/**'
      - '.github/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep incremental off in CI: it bloats the cache and doesn't help cold builds.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/tropel-sdk is a git submodule of transithq/tropel-sdk
          # (see .gitmodules) — every cargo job needs it populated.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/tropel-sdk is a git submodule of transithq/tropel-sdk
          # (see .gitmodules) — every cargo job needs it populated.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-targets covers lib/bins/tests/benches/examples.
      # Add --all-features once the unstable-* SDK features and the wasm tier
      # are known to lint clean; leaving it off keeps this gate trustworthy.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/tropel-sdk is a git submodule of transithq/tropel-sdk
          # (see .gitmodules) — every cargo job needs it populated.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Build tests
        run: cargo test --workspace --no-run --locked
      - name: Run tests
        run: cargo test --workspace -- --nocapture

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/tropel-sdk is a git submodule of transithq/tropel-sdk
          # (see .gitmodules) — every cargo job needs it populated.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # `check` not `test`: dev-dependencies may legitimately need newer Rust.
      - run: cargo check --workspace --locked

  semver:
    name: semver-checks (tropel-sdk API breaks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/tropel-sdk is a git submodule of transithq/tropel-sdk
          # (see .gitmodules) — every cargo job needs it populated.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: semver
      # P2 (TROPEL_MODULARIZATION_TODO.md): the SDK is live, so any breaking
      # change to the published contract must bump the minor before release.
      # `check-release` diffs the working tree against the last version on
      # crates.io and fails on breaking changes.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - run: cargo semver-checks check-release -p tropel-sdk

  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/tropel-sdk is a git submodule of transithq/tropel-sdk
          # (see .gitmodules) — every cargo job needs it populated.
          submodules: recursive
      - uses: EmbarkStudios/cargo-deny-action@v2
        env:
          # Override rust-toolchain.toml's "stable" channel which resolves to
          # stable-x86_64-unknown-linux-musl inside the action's Docker
          # container — that toolchain doesn't exist and the action fails.
          RUSTUP_TOOLCHAIN: "1.85.0"
        with:
          command: check advisories licenses bans sources
          rust-version: 1.85.0

  sdk-gates:
    name: sdk gates (leaf · wasm · out-of-workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/tropel-sdk is a git submodule of transithq/tropel-sdk
          # (see .gitmodules) — every cargo job needs it populated.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk-gates
      # The enforcement that replaces a repo boundary (TROPEL_MODULARIZATION_TODO.md → P2):
      #   1. tropel-sdk must stay a leaf (zero tropel-* deps) — the P1 inversion,
      #      made permanent. A stray `tropel-core` dep added later would silently
      #      destroy the publishable-isolated-crate property this enforces.
      #   2. tropel-sdk must compile for wasm32 (browser slice target), with and
      #      without the inventory-bearing registration feature.
      #   3. the `cargo package`d artifact must build from a consumer outside the
      #      workspace — catches missing files / broken feature defaults that the
      #      in-repo build never sees.
      # The script lives in the SDK submodule — crates/tropel-sdk is a git
      # submodule of transithq/tropel-sdk — and the SDK repo's own CI runs
      # the same script at its root.
      - run: bash crates/tropel-sdk/scripts/sdk-gates.sh

  wasm:
    name: wasm slice (tropel-web builds + size budget)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/tropel-sdk is a git submodule of transithq/tropel-sdk
          # (see .gitmodules) — every cargo job needs it populated.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      # TROPEL_WASM_BUILD.md Step 1: the browser slice needs the WASI SDK
      # (QuickJS is C and needs a libc; wasm32-unknown-unknown has none).
      # Shell env wins over the committed [env] block, so override the
      # machine-local Windows paths here.
      - name: Install WASI SDK
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          sudo mkdir -p /opt/wasi-sdk
          sudo tar xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
      - name: P5b size-budget gate
        env:
          WASI_SDK: /opt/wasi-sdk
          CC_wasm32_wasip1: /opt/wasi-sdk/bin/clang
          AR_wasm32_wasip1: /opt/wasi-sdk/bin/llvm-ar
          BINDGEN_EXTRA_CLANG_ARGS_wasm32_wasip1: >-
            --sysroot=/opt/wasi-sdk/share/wasi-sysroot --target=wasm32-wasi
        run: bash scripts/wasm-size.sh

      # F3 (TROPEL_MODULARIZATION_REVIEW.md): the REAL differential harness —
      # the same fixture through native tropel-runtime and through the wasm32
      # build, diffing the full outcome (status, headers, variable state,
      # assertion results, setNextRequest trace). An INTEGRATION test
      # (tests/native_vs_wasm.rs), so it links the lib without cfg(test) —
      # the native_seam is pub(doc(hidden)) for it. Requires the artifact from
      # the size gate above; TROPEL_REQUIRE_WASM=1 turns a missing artifact
      # into a hard failure rather than the local-dev skip.
      - name: F3 differential harness (native vs wasm32 runtime)
        env:
          TROPEL_REQUIRE_WASM: "1"
        run: cargo test -p tropel-web --test native_vs_wasm

      # P6 (@tropel/shims): the js/ shim bundle as an npm package. The smoke
      # asserts the built bundle is byte-identical to the repo's js/ sources
      # in the engine's ShimBundle::default() order — the single source of
      # truth — so a stale copy fails the gate. MUST run BEFORE the
      # runtime-wasm smoke (W2 #186): the root npm workspace resolves
      # @tropel/shims to THIS local package, and runtime-wasm's tsc needs
      # packages/shims/dist (gitignored) to exist.
      - name: P6 shims npm smoke (@tropel/shims)
        run: |
          cd packages/shims
          npm install --no-audit --no-fund
          npm run build
          node smoke.mjs

      # P6 (TROPEL_MODULARIZATION_TODO.md): @tropel/runtime-wasm — the npm host
      # that ships the wasm slice. Build the TS wrapper, copy the artifact
      # into the package (build.sh), and drive the same F3 fixture through
      # node:wasi from OUTSIDE Rust — proving the published package works.
      # TROPEL_REQUIRE_WASM=1 turns a missing artifact into a hard failure
      # (same gate as the F3 harness). W2 #186: the root package.json
      # workspace makes @tropel/shims resolve to packages/shims (NOT the
      # npmjs.org copy), so a local js/ edit flows into this smoke too.
      - name: P6 npm smoke (@tropel/runtime-wasm)
        env:
          TROPEL_REQUIRE_WASM: "1"
        run: |
          cd packages/runtime-wasm
          npm install --no-audit --no-fund
          npm run build
          node smoke.mjs

      # P6 lockstep versioning: one version stamped into the binary, the wasm
      # runtime, and both npm packages. A drift here breaks the version
      # handshake (agent vs wasm) before a single load runs.
      - name: P6 lockstep versioning gate
        run: bash scripts/version-lockstep.sh

  smoke:
    name: "e2e smoke (samples: k6, postman, openapi, har)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # crates/tropel-sdk is a git submodule of transithq/tropel-sdk
          # (see .gitmodules) — every cargo job needs it populated.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke

      - name: Build release binary
        run: cargo build --release --locked --bin tropel

      # `inspect` parses the input and prints the resolved scenario. A regression
      # in an adapter, the k6 import stripper, or the module resolver fails here
      # loudly instead of silently producing a zero-iteration run.
      - name: Inspect every example
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in examples/k6/*.js examples/har/*.har examples/openapi/*.yaml examples/collections/*.json; do
            echo "::group::inspect $f"
            ./target/release/tropel inspect "$f"
            echo "::endgroup::"
          done

      # Server + client in ONE step: GitHub Actions terminates a step's
      # background processes when the step ends, so a server started in its own
      # step would be dead before the later steps ran (connection refused →
      # zero requests → false red). The trap kills the server at step end.
      # The local server only feeds the threshold negative-control below; the
      # sample e2e runs target the public demo APIs the samples are written for
      # (test.k6.io, jsonplaceholder.typicode.com, postman-echo.com).
      - name: Smoke — samples e2e (k6, postman, openapi, har) + threshold breach
        run: |
          set -euo pipefail
          python3 -m http.server 8787 --bind 127.0.0.1 --directory .github/ci/www \
            >/tmp/tropel-smoke-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8787/ok.json >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8787/ok.json >/dev/null

          T=./target/release/tropel

          # THE behavioural gate. A run that "succeeds" with zero requests is the
          # failure mode we're guarding against, so assert on the metrics, not the
          # exit code alone. Summary shape (verified against real exports in
          # tropel-engine/src/summary.rs): totals live under .state (http_reqs,
          # iterations, checks*); .metrics is keyed PER-URL with tags, so timed
          # requests are asserted by summing the tagged http_req_duration series.
          assert_run() {  # $1 = summary file, $2 = label
            jq -e '(.state.http_reqs // 0) > 0' "$1" >/dev/null \
              || { echo "FAIL: $2 produced no requests"; exit 1; }
            echo "ok: $2 http_reqs > 0"
            jq -e '(.state.iterations // 0) > 0' "$1" >/dev/null \
              || { echo "FAIL: $2 produced no iterations"; exit 1; }
            echo "ok: $2 iterations > 0"
            jq -e '([.metrics | to_entries[] | select(.key | startswith("http_req_duration")) | .value.values.count] | add // 0) > 0' "$1" >/dev/null \
              || { echo "FAIL: $2 recorded no timed requests"; exit 1; }
            echo "ok: $2 http_req_duration > 0"
          }

          echo "::group::k6 (k6_sample_basic)"
          $T run examples/k6/k6_sample_basic.js --vus 2 --duration 5s \
            --summary-export /tmp/sum-k6.json
          echo "::endgroup::"
          assert_run /tmp/sum-k6.json "k6"

          echo "::group::postman (simple-api)"
          $T run examples/collections/simple-api.json --vus 1 --duration 5s \
            --summary-export /tmp/sum-postman.json
          echo "::endgroup::"
          assert_run /tmp/sum-postman.json "postman"
          # Postman test scripts must have run and none may have failed.
          jq -e '(.state.checksPassed // 0) > 0' /tmp/sum-postman.json >/dev/null \
            || { echo "FAIL: postman recorded no passed checks"; exit 1; }
          jq -e '(.state.checksFailed // 0) == 0' /tmp/sum-postman.json >/dev/null \
            || { echo "FAIL: a postman check failed"; exit 1; }
          echo "ok: postman checks recorded, none failed"

          echo "::group::openapi (working_api)"
          $T run examples/openapi/working_api.yaml --vus 1 --duration 5s \
            --summary-export /tmp/sum-openapi.json
          echo "::endgroup::"
          assert_run /tmp/sum-openapi.json "openapi"

          echo "::group::har (01_get_posts)"
          $T run examples/har/01_get_posts.har --vus 1 --duration 5s \
            --summary-export /tmp/sum-har.json
          echo "::endgroup::"
          assert_run /tmp/sum-har.json "har"

          # Informational, NOT gated on exit code: these two samples declare
          # thresholds tuned for ideal latency (p(95)<500ms, fail rate <1%) that
          # shared CI runners cannot reliably meet against public hosts, and
          # their stages/scenarios must not be overridden with CLI duration
          # (double config yields runaway script executions — a 3s override
          # produced 25k failed execs with 0 requests). Metrics are still gated.
          echo "::group::k6 thresholds (informational)"
          set +e
          $T run examples/k6/k6_sample_thresholds.js --summary-export /tmp/sum-k6-thr.json
          echo "::endgroup::"
          set -e
          jq -e '(.state.http_reqs // 0) > 0' /tmp/sum-k6-thr.json >/dev/null \
            || { echo "FAIL: k6 thresholds sample produced no requests"; exit 1; }
          echo "ok: k6 thresholds (informational) produced requests"

          echo "::group::k6 scenarios (informational)"
          set +e
          $T run examples/k6/k6_sample_scenarios.js --summary-export /tmp/sum-k6-scn.json
          echo "::endgroup::"
          set -e
          jq -e '(.state.http_reqs // 0) > 0' /tmp/sum-k6-scn.json >/dev/null \
            || { echo "FAIL: k6 scenarios sample produced no requests"; exit 1; }
          echo "ok: k6 scenarios (informational) produced requests"

          # The exit-code contract: a breached threshold must fail the process.
          # If this passes with exit 0, thresholds are inert (which has happened).
          if $T run .github/ci/smoke-threshold-fail.js \
               --vus 2 --duration 3s; then
            echo "FAIL: impossible threshold did not fail the run (exit 0)"
            exit 1
          fi
          echo "ok: breached threshold produced a non-zero exit"

  # Aggregate gate — set this single check as the required status in branch
  # protection so adding a job doesn't require editing the rule.
  ci-ok:
    name: CI OK
    if: always()
    needs: [fmt, clippy, test, msrv, semver, deny, sdk-gates, wasm, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all green"
